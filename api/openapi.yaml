{
  "openapi": "3.0.3",
  "info": {
    "title": "DocMind API",
    "version": "1.0.0",
    "description": "Локальный однопользовательский RAG-сервис. Авторизации нет. TXT/MD/PDF до 10 MiB. По умолчанию используются fake-провайдеры."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/healthz": {
      "get": {
        "summary": "Проверка процесса",
        "responses": {
          "200": {
            "description": "Готов",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "405": {
            "description": "Метод не поддерживается"
          }
        },
        "operationId": "liveness"
      }
    },
    "/readyz": {
      "get": {
        "summary": "Готовность PostgreSQL и схемы",
        "responses": {
          "200": {
            "description": "Готов",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "503": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "405": {
            "description": "Метод не поддерживается"
          }
        },
        "operationId": "readiness"
      }
    },
    "/api/v1/documents": {
      "get": {
        "summary": "Список документов",
        "responses": {
          "200": {
            "description": "Страница документов",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "limit",
                    "offset"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Document"
                      }
                    },
                    "limit": {
                      "type": "integer"
                    },
                    "offset": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "offset",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100000,
              "default": 0
            }
          }
        ],
        "operationId": "listDocuments"
      },
      "post": {
        "summary": "Загрузить один документ",
        "responses": {
          "202": {
            "description": "Принят в очередь",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Accepted"
                }
              }
            }
          },
          "400": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Изменяющий запрос с чужого сайта отклонён до записи данных."
          }
        },
        "requestBody": {
          "required": true,
          "description": "Ровно одна multipart-часть file; файл до 10 MiB, всё тело до 10 MiB + 64 KiB. Проверяется содержимое. TXT/MD в UTF-8; PDF только с текстовым слоем.",
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "file"
                ],
                "additionalProperties": false,
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  }
                }
              }
            }
          }
        },
        "operationId": "uploadDocument",
        "description": " Повтор одинаковых байтов одного MIME возвращает существующий документ без нового задания."
      }
    },
    "/api/v1/documents/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "get": {
        "summary": "Метаданные и статус",
        "responses": {
          "200": {
            "description": "Документ",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Document"
                }
              }
            }
          },
          "400": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "operationId": "getDocument"
      },
      "delete": {
        "summary": "Удалить документ, индекс и задание",
        "responses": {
          "204": {
            "description": "Удалён. Удаление исходного файла может завершиться фоновой очисткой."
          },
          "400": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Изменяющий запрос с чужого сайта отклонён до записи данных."
          }
        },
        "operationId": "deleteDocument"
      }
    },
    "/api/v1/questions": {
      "post": {
        "summary": "Ответить по выбранным документам",
        "responses": {
          "200": {
            "description": "Ответ и проверенные источники",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Answer"
                }
              }
            }
          },
          "400": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "408": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "504": {
            "description": "Ошибка запроса или зависимости",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Недостаточно доступного бюджета для резерва. До этого мог быть оплачен embedding вопроса. Retry-After до следующего UTC-дня."
          },
          "403": {
            "description": "Изменяющий запрос с чужого сайта отклонён до записи данных."
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Question"
              },
              "example": {
                "question": "Какие ограничения описаны?",
                "document_ids": [
                  "f55ecdd7-4be7-4df1-b8db-92790d54c4b6"
                ]
              }
            }
          }
        },
        "description": "До двух параллельных вопросов. Контекст: до 5 фрагментов / 16 KiB. Deadline по умолчанию 20 секунд. 409: документ не готов или модель индекса не совпадает. 502: неверный ответ модели; 503: перегрузка/недоступность; 504: таймаут. Для 503 возвращается Retry-After.",
        "operationId": "askQuestion"
      }
    },
    "/metrics": {
      "get": {
        "summary": "Базовые HTTP-метрики Prometheus",
        "responses": {
          "200": {
            "description": "Счётчик запросов и summary времени (count/sum), без квантилей. /metrics исключён из измерений.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "405": {
            "description": "Метод не поддерживается"
          }
        },
        "operationId": "httpMetrics"
      }
    },
    "/api/v1/usage": {
      "get": {
        "summary": "Потребление и дневной бюджет AI",
        "operationId": "getUsage",
        "responses": {
          "200": {
            "description": "Общая статистика API, worker и CLI за текущий UTC-день",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Usage"
                }
              }
            }
          },
          "503": {
            "description": "Учёт недоступен"
          },
          "405": {
            "description": "Метод не поддерживается"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      },
      "Health": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "ready"
            ]
          }
        }
      },
      "Accepted": {
        "type": "object",
        "required": [
          "id",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "queued"
            ]
          }
        }
      },
      "Document": {
        "type": "object",
        "required": [
          "id",
          "original_name",
          "mime_type",
          "size_bytes",
          "status",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "original_name": {
            "type": "string"
          },
          "mime_type": {
            "type": "string"
          },
          "size_bytes": {
            "type": "integer",
            "format": "int64",
            "maximum": 10485760
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "processing",
              "ready",
              "failed"
            ]
          },
          "error_message": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Question": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "question",
          "document_ids"
        ],
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4000,
            "description": "Непустой вопрос. Дополнительно: максимум 4000 байт UTF-8, тело максимум 16 KiB."
          },
          "document_ids": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Все документы должны иметь статус ready и совместимую модель индекса."
          }
        }
      },
      "Source": {
        "type": "object",
        "required": [
          "document_id",
          "chunk_id",
          "page",
          "snippet"
        ],
        "properties": {
          "document_id": {
            "type": "string",
            "format": "uuid"
          },
          "chunk_id": {
            "type": "string",
            "format": "uuid"
          },
          "page": {
            "type": "integer",
            "minimum": 1,
            "nullable": true
          },
          "snippet": {
            "type": "string",
            "description": "Текст реально найденного фрагмента."
          }
        }
      },
      "Answer": {
        "type": "object",
        "required": [
          "answer",
          "sources"
        ],
        "properties": {
          "answer": {
            "type": "string",
            "description": "До 8 KiB UTF-8. При недостатке контекста ответ сообщает об этом."
          },
          "sources": {
            "type": "array",
            "maxItems": 5,
            "items": {
              "$ref": "#/components/schemas/Source"
            },
            "description": "Может быть пустым. Сервер проверяет происхождение фрагментов, но не истинность ответа."
          }
        }
      },
      "Usage": {
        "type": "object",
        "required": [
          "day_utc",
          "limit_rub",
          "estimated_rub",
          "reserved_rub",
          "remaining_rub",
          "calls",
          "recorded_calls",
          "unknown_calls",
          "pending_calls",
          "input_tokens",
          "output_tokens",
          "embedding_tokens",
          "reservation_overruns"
        ],
        "properties": {
          "day_utc": {
            "type": "string"
          },
          "limit_rub": {
            "type": "string"
          },
          "estimated_rub": {
            "type": "string"
          },
          "reserved_rub": {
            "type": "string"
          },
          "remaining_rub": {
            "type": "string"
          },
          "calls": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "description": "Допущенные попытки. Записываются до сетевого обращения; не являются подтверждённым числом оплаченных вызовов."
          },
          "recorded_calls": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "unknown_calls": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "pending_calls": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "input_tokens": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "output_tokens": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "embedding_tokens": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "reservation_overruns": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        },
        "description": "Учёт за день начала запроса UTC. Денежные строки — RUB, 9 знаков после точки. Оценка по usage и настроенным ценам, не счёт Billing. Reserved включает pending/unknown; fake-вызовы не учитываются."
      }
    }
  },
  "security": []
}
